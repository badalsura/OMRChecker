<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User guide</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/png" href="/branding/icon.png">
  <style>
    /* app.css fixes the body to the window height, which would let the
       sticky header and contents scroll away after the first screen */
    html, body { height: auto; }
    body { margin: 0; display: block; }
    .help-top { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .help-top .brand-icon { width: 22px; height: 22px; border-radius: 5px; }
    .help-top h1 { font-size: 16px; margin: 0; white-space: nowrap; }
    #help-search { flex: 1; max-width: 520px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; }
    #help-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .help-wrap { display: flex; align-items: flex-start; }
    .help-toc { position: sticky; top: 52px; width: 290px; flex: none; max-height: calc(100vh - 52px); overflow: auto; padding: 12px 8px 40px 16px; border-right: 1px solid var(--border); font-size: 13px; }
    .help-toc a { display: block; padding: 3px 6px; color: var(--text); text-decoration: none; border-radius: 4px; }
    .help-toc a:hover { background: var(--accent-soft); }
    .help-toc a.l2 { font-weight: 650; margin-top: 8px; }
    .help-toc a.l3 { padding-left: 16px; color: var(--muted); }
    .help-toc a.hidden, .help-doc .hidden { display: none; }
    .help-doc { flex: 1; min-width: 0; max-width: 980px; padding: 8px 32px 80px; line-height: 1.55; font-size: 14.5px; }
    .help-doc h1, .help-doc h2, .help-doc h3, .help-doc h4 { scroll-margin-top: 64px; }
    .help-doc h2 { margin-top: 36px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
    .help-doc h3 { margin-top: 28px; }
    .help-doc h4 { margin-top: 20px; }
    .help-doc table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; width: 100%; }
    .help-doc th, .help-doc td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
    .help-doc th { background: var(--bg); }
    .help-doc code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
    .help-doc pre { background: var(--bg); padding: 10px 12px; border-radius: 6px; overflow: auto; }
    .help-doc pre code { background: none; padding: 0; }
    .help-doc mark { background: #ffe58a; color: #1d2330; padding: 0 1px; border-radius: 2px; }
    .help-doc blockquote { margin: 10px 0; padding: 6px 12px; border-left: 4px solid var(--accent); background: var(--accent-soft); }
    @media (max-width: 800px) { .help-toc { display: none; } .help-doc { padding: 8px 16px 60px; } }
  </style>
</head>
<body>
  <header class="help-top">
    <img class="brand-icon" src="/branding/icon.png" alt="">
    <h1><span class="brand-name">UNIC OMR Scanner</span> · User guide</h1>
    <input id="help-search" type="search" placeholder="Search the guide (e.g. double mark, regrade, index points)…" autofocus>
    <span id="help-count"></span>
  </header>
  <div class="help-wrap">
    <nav class="help-toc" id="help-toc"></nav>
    <article class="help-doc" id="help-doc">Loading the guide…</article>
  </div>
  <script src="/static/help.js"></script>
</body>
</html>
