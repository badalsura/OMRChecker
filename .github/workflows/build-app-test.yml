name: Test build of the app window

# Two builds of the app window (packaging/omr_app.py) to compare the window
# engines side by side: WebView2 109 and Qt 5.15. Only the window is under test,
# so these leave out the OCR models, Tesseract and cloudflared (ICR zones go to
# manual review) and run no test suite: each build only checks that the exe
# starts its engine and takes a screenshot of the window.

on:
  workflow_dispatch:
    inputs:
      webview2_cab:
        description: "WebView2 Fixed Version runtime 109 x64 .cab; empty = the 109.0.1518.78 archive copy (Microsoft's page now lists only the newest two; every file in it must carry Microsoft's signature)"
        default: ""
  # A workflow_dispatch workflow can be started only once it is on the default
  # branch; until then a push of the app window files to this branch builds it
  push:
    branches:
      - claude/project-thread-7ju3uh
    paths:
      - packaging/omr_app.py
      - packaging/requirements-app-*.txt
      - .github/workflows/build-app-test.yml

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [webview2, qt]
    env:
      OMR_APP_ENGINE: ${{ matrix.engine }}
      OMR_BUILD_MODE: onedir
      PYTHONIOENCODING: utf-8
      WEBVIEW2_CAB: ${{ github.event.inputs.webview2_cab || 'https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-win7.txt
            packaging/requirements-app-${{ matrix.engine }}.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip<25" wheel
          python -m pip install -r packaging/requirements-win7.txt -r packaging/requirements-app-${{ matrix.engine }}.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/omr.spec

      - name: Reuse the WebView2 runtime
        if: matrix.engine == 'webview2'
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: build/webview2
          key: webview2-runtime-${{ hashFiles('.github/workflows/build-app-test.yml') }}-${{ env.WEBVIEW2_CAB }}

      - name: Fetch and check the WebView2 109 runtime
        if: matrix.engine == 'webview2' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cab = "build\webview2.cab"
          Invoke-WebRequest -Uri $env:WEBVIEW2_CAB -OutFile $cab
          New-Item -ItemType Directory -Force -Path build\webview2_x | Out-Null
          expand.exe $cab -F:* build\webview2_x | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "expand failed"; exit 1 }
          $exe = Get-ChildItem build\webview2_x -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "msedgewebview2.exe is not in the .cab"; exit 1 }
          $version = $exe.VersionInfo.ProductVersion
          Write-Host "Runtime version $version"
          if (-not $version.StartsWith("109.")) { Write-Error "Expected runtime 109, got $version"; exit 1 }
          # The .cab may come from a mirror: every program file must be signed by
          # Microsoft (Widevine, the video DRM module Edge ships, by Google)
          $bad = Get-ChildItem $exe.Directory.FullName -Recurse -Include *.exe,*.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $signer = if ($_.Name -eq "widevinecdm.dll") { "O=Google LLC" } else { "O=Microsoft Corporation" }
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch $signer) { "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)" }
          }
          if ($bad) { $bad | Write-Host; Write-Error "Files without a valid Microsoft signature"; exit 1 }
          Move-Item $exe.Directory.FullName build\webview2

      - name: Put the runtime next to the exe
        if: matrix.engine == 'webview2'
        shell: pwsh
        run: Copy-Item -Recurse build\webview2 dist\OMRChecker\webview2

      - name: Start the app, check its engine, take a screenshot
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\omr_app_data"
          $p = Start-Process -FilePath dist\OMRChecker\OMRChecker.exe -ArgumentList "--data-dir",$data -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8766/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("dist\screenshot-${{ matrix.engine }}.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$data\app.log") { Get-Content "$data\app.log" -Tail 40 }
          if (-not $ok) { Write-Error "The engine did not answer on 127.0.0.1:8766"; exit 1 }
          if (-not $alive) { Write-Error "The app closed by itself"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: OMRChecker-app-${{ matrix.engine }}
          path: dist/OMRChecker/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.engine }}
          path: dist/screenshot-${{ matrix.engine }}.png
          if-no-files-found: ignore
