name: Build Windows portable exe

on:
  workflow_dispatch:
    inputs:
      build:
        description: "app = the app window, for distribution (installer, modern and legacy zips); server = the launcher with remote access and every server feature, for our own use; all = both"
        default: all
      mode:
        description: "server build only: onedir | onefile | both (the app is always onedir)"
        default: both
      default_engine:
        description: "OCR engine used first: tesseract | paddle"
        default: tesseract
      fallback_engine:
        description: "OCR engine tried when the first read is empty, unsure or invalid: paddle | tesseract | none"
        default: paddle
      paddle_models:
        description: "PaddleOCR model sizes to bundle, space separated; the first is the default: mobile server"
        default: mobile server
      paddle_langs:
        description: "PaddleOCR recognisers, space separated (en, devanagari, ch = main multilingual, reads handwriting)"
        default: en devanagari ch
      tessdata:
        description: "Tesseract model set: best | fast"
        default: best
      tess_langs:
        description: "Tesseract languages, space separated (eng, hin, ...)"
        default: eng hin
      cloudflared:
        description: "cloudflared release to bundle (latest or e.g. 2025.9.1)"
        default: latest
      installer_release:
        description: "Publish to this GitHub release tag (e.g. v1.0.0; a tag with a dash, v1.0.0-test1, makes a pre-release): the online installers, the app and server builds and the License Issuer. Empty = artifacts only"
        default: ""
  push:
    tags:
      - "v*"

jobs:
  # OCR models are fetched and converted once on Linux with a current Python:
  # paddle2onnx and PaddlePaddle (needed only for the conversion) have no
  # Python 3.8 Windows wheels. The exe itself only needs the .onnx files and
  # runs them on the onnxruntime it already ships.
  ocr-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_ENGINE: ${{ github.event.inputs.default_engine || 'tesseract' }}
      FALLBACK_ENGINE: ${{ github.event.inputs.fallback_engine || 'paddle' }}
      PADDLE_MODELS: ${{ github.event.inputs.paddle_models || 'mobile server' }}
      PADDLE_LANGS: ${{ github.event.inputs.paddle_langs || 'en devanagari ch' }}
      TESSDATA: ${{ github.event.inputs.tessdata || 'best' }}
      TESS_LANGS: ${{ github.event.inputs.tess_langs || 'eng hin' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Models are kept between runs: fetched and converted only when the
      # choices or the fetch script change
      - name: Reuse fetched models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: |
            packaging/tessdata/
            packaging/models/
            packaging/ocr_build.json
          key: ocr-models-${{ hashFiles('packaging/fetch_ocr_models.py') }}-${{ env.TESSDATA }}-${{ env.TESS_LANGS }}-${{ env.PADDLE_MODELS }}-${{ env.PADDLE_LANGS }}-${{ env.DEFAULT_ENGINE }}-${{ env.FALLBACK_ENGINE }}

      - name: Install the model converter (build machine only)
        if: steps.models-cache.outputs.cache-hit != 'true'
        # paddle2onnx imports "packaging" without declaring it
        run: python -m pip install paddlepaddle paddle2onnx packaging

      - name: Fetch Tesseract and PaddleOCR models
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          # Every build bundles Tesseract and PaddleOCR (PaddleOCR also reads ICR zones)
          python packaging/fetch_ocr_models.py --tessdata $TESSDATA --langs $TESS_LANGS \
            --paddle $PADDLE_MODELS --paddle-langs $PADDLE_LANGS \
            --default-engine $DEFAULT_ENGINE --fallback-engine $FALLBACK_ENGINE
          cat packaging/ocr_build.json
          ls -l packaging/tessdata packaging/models/paddleocr 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ocr-models
          path: |
            packaging/tessdata/
            packaging/models/
            packaging/ocr_build.json
          if-no-files-found: error

  build:
    needs: ocr-models
    # Python 3.8 is the newest Python that runs on Windows 7; an exe built with it
    # (and PyInstaller 5.13) starts on Windows 7 SP1 through 11.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON((github.event.inputs.build || 'all') == 'all' && '["app","server"]' || format('["{0}"]', github.event.inputs.build)) }}
    env:
      KIND: ${{ matrix.kind }}
      OMR_APP: ${{ matrix.kind == 'app' && '1' || '0' }}
      OMR_BUILD_MODE: ${{ matrix.kind == 'app' && 'onedir' || github.event.inputs.mode || 'both' }}
      PYTHONIOENCODING: utf-8
      # WebView2 runtime 109 for the legacy app build (Windows 7/8.1). Microsoft's
      # page lists only the newest two Fixed Version runtimes; every program file
      # in it must carry Microsoft's signature (Google's for widevinecdm.dll)
      WEBVIEW2_CAB: https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-win7.txt
            packaging/requirements-app.txt

      - uses: actions/download-artifact@v4
        with:
          name: ocr-models
          path: packaging

      - name: Verify Windows cp38 wheels exist for every pin
        run: python packaging/verify_wheels.py

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25" wheel
          python -m pip install -r packaging/requirements-win7.txt
          if ($env:OMR_APP -eq "1") { python -m pip install -r packaging/requirements-app.txt }

      - name: Engine smoke test from source
        run: python packaging/omr_desktop.py --selftest

      - name: Reuse Tesseract and cloudflared
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            packaging/tesseract/
            packaging/cloudflared/
          key: win-tools-${{ github.event.inputs.cloudflared || 'latest' }}-${{ hashFiles('packaging/prepare_bundle.py') }}

      - name: Bundle Tesseract (UB Mannheim build)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $src = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$src\tesseract.exe")) { Write-Error "tesseract.exe not found in $src"; exit 1 }
          & "$src\tesseract.exe" --version
          # The engine and its DLLs only: the training tools, docs and uninstaller
          # are not needed. The bundled tessdata (packaging\tessdata, best/fast)
          # is used first; the installer's eng/osd stay as a fallback.
          $dst = "packaging\tesseract"
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe" $dst
          Copy-Item "$src\*.dll" $dst
          foreach ($f in @("eng.traineddata", "osd.traineddata")) {
            if (Test-Path "$src\tessdata\$f") { Copy-Item "$src\tessdata\$f" "$dst\tessdata" }
          }
          if (Test-Path "$src\tessdata\configs") { Copy-Item -Recurse "$src\tessdata\configs" "$dst\tessdata" }
          & "$dst\tesseract.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "the copied tesseract.exe does not start"; exit 1 }

      - name: Bundle cloudflared
        # Remote access is a server-build feature
        if: env.KIND == 'server'
        shell: pwsh
        run: |
          python packaging/prepare_bundle.py --only cloudflared --cloudflared-release "${{ github.event.inputs.cloudflared || 'latest' }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          packaging\cloudflared\cloudflared.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "cloudflared does not start"; exit 1 }

      - name: Write the license public key
        shell: pwsh
        env:
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LICENSE_PUBLIC_KEY)) {
            Write-Warning "LICENSE_PUBLIC_KEY secret is not set: this build will NOT verify licenses. Set it under Settings > Secrets and variables > Actions (see docs/licensing.md)."
          } else {
            New-Item -ItemType Directory -Force src\licensing | Out-Null
            $env:LICENSE_PUBLIC_KEY | Set-Content -NoNewline src\licensing\public_key.pem
            if (-not (Select-String -Path src\licensing\public_key.pem -Pattern "BEGIN PUBLIC KEY" -Quiet)) {
              Write-Error "LICENSE_PUBLIC_KEY does not look like a PEM public key"; exit 1
            }
            Write-Host "Public key written."
          }

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/omr.spec

      - name: Smoke-test the onedir exe
        if: env.KIND == 'server' && env.OMR_BUILD_MODE != 'onefile'
        shell: pwsh
        run: |
          dist\OMRChecker\OMRChecker.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\OMRChecker\OMRChecker.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Headless bulk run: an unlicensed exe refuses it (exit 3); the
          # selftest above already read sheets through the process pool
          $sample = "samples\sample1"
          dist\OMRChecker\OMRChecker.exe --bulk $sample --template "$sample\template.json" --out build\bulk_out --workers 2
          if ($LASTEXITCODE -ne 3) { Write-Error "an unlicensed bulk run was not refused ($LASTEXITCODE)"; exit 1 }
          # Server mode: start, query /health, stop
          $p = Start-Process -FilePath dist\OMRChecker\OMRChecker.exe -ArgumentList "--no-browser","--no-window","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { exit 1 }
          # The bundled PaddleOCR models must load in the exe
          $build = Get-Content packaging\ocr_build.json | ConvertFrom-Json
          Write-Host "OCR engines in the exe:" ($r.engines | ConvertTo-Json -Compress)
          if ($build.bundled.paddle -and -not $r.engines.paddleocr) { Write-Error "PaddleOCR models were bundled but do not load"; exit 1 }
          # The runner has Tesseract installed too, so check the bundled copy itself
          if (!(Test-Path dist\OMRChecker\tesseract\tesseract.exe)) { Write-Error "Tesseract is missing from the exe folder"; exit 1 }
          if (-not $r.engines.tesseract) { Write-Error "Tesseract was bundled but is not found by the exe"; exit 1 }
          if (!(Test-Path dist\OMRChecker\cloudflared\cloudflared.exe)) { Write-Error "cloudflared is missing from the exe folder"; exit 1 }
          Compress-Archive -Force -Path dist\OMRChecker -DestinationPath dist\OMRChecker-portable-win64.zip

      - name: Smoke-test the onefile exe
        if: env.KIND == 'server' && env.OMR_BUILD_MODE != 'onedir'
        shell: pwsh
        run: |
          dist\OMRChecker-onefile.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke-test the app exe
        if: env.KIND == 'app'
        shell: pwsh
        run: |
          # A windowed exe: the result is its exit code (details in app.log)
          $data = "$env:RUNNER_TEMP\omr_app_data"
          $t = Start-Process -FilePath dist\OMRChecker\OMRChecker.exe -ArgumentList "--selftest","--data-dir",$data -Wait -PassThru
          if (Test-Path "$data\app.log") { Get-Content "$data\app.log" -Tail 30 }
          if ($t.ExitCode -ne 0) { Write-Error "selftest failed ($($t.ExitCode))"; exit 1 }
          # The window and its engine: start, query /health, stop
          $p = Start-Process -FilePath dist\OMRChecker\OMRChecker.exe -ArgumentList "--data-dir",$data -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8766/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { Get-Content "$data\app.log" -Tail 40; Write-Error "The app's engine did not answer"; exit 1 }
          if (-not $alive) { Write-Error "The app closed by itself"; exit 1 }
          $build = Get-Content packaging\ocr_build.json | ConvertFrom-Json
          Write-Host "OCR engines in the app:" ($r.engines | ConvertTo-Json -Compress)
          if ($build.bundled.paddle -and -not $r.engines.paddleocr) { Write-Error "PaddleOCR models were bundled but do not load"; exit 1 }
          if (!(Test-Path dist\OMRChecker\tesseract\tesseract.exe)) { Write-Error "Tesseract is missing from the exe folder"; exit 1 }
          if (Test-Path dist\OMRChecker\omr_data) { Remove-Item -Recurse -Force dist\OMRChecker\omr_data }

      - name: Reuse the WebView2 runtime
        if: env.KIND == 'app'
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: build/webview2
          key: webview2-runtime-${{ env.WEBVIEW2_CAB }}

      - name: Fetch and check the WebView2 109 runtime
        if: env.KIND == 'app' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cab = "build\webview2.cab"
          New-Item -ItemType Directory -Force -Path build\webview2_x | Out-Null
          Invoke-WebRequest -Uri $env:WEBVIEW2_CAB -OutFile $cab
          expand.exe $cab -F:* build\webview2_x | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "expand failed"; exit 1 }
          $exe = Get-ChildItem build\webview2_x -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "msedgewebview2.exe is not in the .cab"; exit 1 }
          $version = $exe.VersionInfo.ProductVersion
          Write-Host "Runtime version $version"
          if (-not $version.StartsWith("109.")) { Write-Error "Expected runtime 109, got $version"; exit 1 }
          $bad = Get-ChildItem $exe.Directory.FullName -Recurse -Include *.exe,*.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $signer = if ($_.Name -eq "widevinecdm.dll") { "O=Google LLC" } else { "O=Microsoft Corporation" }
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch $signer) { "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)" }
          }
          if ($bad) { $bad | Write-Host; Write-Error "Files without a valid Microsoft signature"; exit 1 }
          Move-Item $exe.Directory.FullName build\webview2

      - name: Pack the app (modern, legacy, WebView2 runtime)
        if: env.KIND == 'app'
        shell: pwsh
        run: |
          # Modern: Windows 10/11, the WebView2 runtime Windows keeps up to date
          7z a -tzip -mx=7 dist\OMRChecker-app-modern-win64.zip .\dist\OMRChecker | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The runtime alone (the installer's download) and the legacy zip with it
          7z a -tzip -mx=7 dist\OMRChecker-webview2-109.zip .\build\webview2\* | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Recurse build\webview2 dist\OMRChecker\webview2
          7z a -tzip -mx=7 dist\OMRChecker-app-legacy-win64.zip .\dist\OMRChecker | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force dist\OMRChecker\webview2
          Compress-Archive -Force -Path dist\OMRChecker -DestinationPath dist\OMRChecker-portable-win64.zip
          Get-ChildItem dist\*.zip | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - uses: actions/upload-artifact@v4
        if: env.KIND == 'app'
        with:
          name: OMRChecker-app
          path: |
            dist/OMRChecker-app-modern-win64.zip
            dist/OMRChecker-app-legacy-win64.zip
          if-no-files-found: error

      # What the installer job splits into its downloads
      - uses: actions/upload-artifact@v4
        if: env.KIND == 'app'
        with:
          name: installer-input-app
          path: |
            dist/OMRChecker-portable-win64.zip
            dist/OMRChecker-webview2-109.zip
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: env.KIND == 'server'
        with:
          name: OMRChecker-server
          path: |
            dist/OMRChecker-portable-win64.zip
            dist/OMRChecker-onefile.exe
          if-no-files-found: error

  # Online installers: a small Setup.exe that downloads the program and its
  # heavy files from a public GitHub release while installing
  # (packaging/installer/OMRChecker.iss), one for the app (OMRChecker-setup-*)
  # and one for the server build (OMRChecker-server-setup-*). Runs for a pushed
  # v* tag, or when the workflow is run with installer_release set; the server
  # installer needs its onedir build.
  installer:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.installer_release != ''
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON((github.event.inputs.build || 'all') == 'all' && '["app","server"]' || format('["{0}"]', github.event.inputs.build)) }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.installer_release || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      INNO_VERSION: "6.7.1"
      KIND: ${{ matrix.kind }}
      # Release file names: OMRChecker-* for the app, OMRChecker-server-* for the server
      PREFIX: ${{ matrix.kind == 'app' && 'OMRChecker' || 'OMRChecker-server' }}
      # Microsoft's offline .NET Framework 4.8 installer, for Windows 7/8.1
      DOTNET48_URL: https://go.microsoft.com/fwlink/?linkid=2088631
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.kind == 'app' && 'installer-input-app' || 'OMRChecker-server' }}
          path: dist

      - name: Split the build into the installer's downloads
        shell: pwsh
        run: |
          Expand-Archive dist\OMRChecker-portable-win64.zip -DestinationPath build\portable
          $app = "build\portable\OMRChecker"
          if (!(Test-Path "$app\OMRChecker.exe")) { Write-Error "no onedir build in the artifact"; exit 1 }
          New-Item -ItemType Directory -Force build\parts\models, build\parts\tools | Out-Null
          Move-Item "$app\tessdata", "$app\models", "$app\ocr_build.json" build\parts\models
          Move-Item "$app\tesseract" build\parts\tools
          if ($env:KIND -eq "server") { Move-Item "$app\cloudflared" build\parts\tools }
          if (Test-Path "$app\omr_data") { Remove-Item -Recurse -Force "$app\omr_data" }
          New-Item -ItemType Directory -Force build\release | Out-Null
          $parts = @{ App = $app; Models = "build\parts\models"; Tools = "build\parts\tools" }
          $names = @{ App = "$env:PREFIX-program.zip"; Models = "$env:PREFIX-ocr-models.zip"; Tools = "$env:PREFIX-tools.zip" }
          $defines = @("/DPrefix=$env:PREFIX")
          if ($env:KIND -eq "server") { $defines += "/DServer=1" }
          foreach ($key in "App", "Models", "Tools") {
            $zip = "build\release\" + $names[$key]
            # Contents only, so each zip unpacks straight into the install folder
            7z a -tzip -mx=7 $zip ".\$($parts[$key])\*" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $size = (Get-ChildItem -Recurse -File $parts[$key] | Measure-Object -Sum Length).Sum
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
            Write-Host "$($names[$key]): $((Get-Item $zip).Length) bytes, unpacked $size, sha256 $hash"
            $defines += "/D$($key)Size=$size", "/D$($key)Hash=$hash"
          }
          if ($env:KIND -eq "server") { $defines -join "`n" | Set-Content build\defines.txt; exit 0 }
          # App: WebView2 109 (Windows 7/8.1, or 10/11 without WebView2) and .NET 4.8 (Windows 7/8.1)
          Copy-Item dist\OMRChecker-webview2-109.zip build\release\
          New-Item -ItemType Directory -Force build\wv | Out-Null
          Expand-Archive dist\OMRChecker-webview2-109.zip -DestinationPath build\wv
          $size = (Get-ChildItem -Recurse -File build\wv | Measure-Object -Sum Length).Sum
          $hash = (Get-FileHash -Algorithm SHA256 build\release\OMRChecker-webview2-109.zip).Hash.ToLower()
          $defines += "/DWebView2Size=$size", "/DWebView2Hash=$hash"
          $net = "build\release\ndp48-x86-x64-allos-enu.exe"
          Invoke-WebRequest -Uri $env:DOTNET48_URL -OutFile $net
          $sig = Get-AuthenticodeSignature $net
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { Write-Error ".NET 4.8 installer is not signed by Microsoft"; exit 1 }
          Write-Host ".NET installer version" (Get-Item $net).VersionInfo.ProductVersion
          $defines += "/DDotNetSize=$((Get-Item $net).Length)", "/DDotNetHash=$((Get-FileHash -Algorithm SHA256 $net).Hash.ToLower())"
          $defines -join "`n" | Set-Content build\defines.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNO_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          $defines = Get-Content build\defines.txt
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DBaseUrl=$base" @defines packaging\installer\OMRChecker.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "dist\$env:PREFIX-setup-$version.exe" build\release\

      - name: Publish the downloads and Setup.exe as a GitHub release
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ($env:TAG -match '-') { "--prerelease" } else { "" }
            gh release create $env:TAG --target ${{ github.sha }} $pre --title "OMR Checker $env:TAG" --notes "Run OMRChecker-setup-*.exe: it downloads the other files of this release it needs while installing. Without internet, keep the other files of this release next to it. OMRChecker-server-* is the server build (remote access), for our own use."
            # The other installer job may have created it a moment earlier
            if ($LASTEXITCODE -ne 0) { gh release view $env:TAG; if ($LASTEXITCODE -ne 0) { exit 1 } }
          }
          gh release upload $env:TAG (Get-ChildItem build\release\*).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install from the release and smoke-test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "build\release\$env:PREFIX-setup-*.exe").FullName
          # Run from another folder so the zips beside it are not used: this tests the downloads
          New-Item -ItemType Directory -Force build\setup-only | Out-Null
          Copy-Item $setup build\setup-only\
          $exe = (Get-ChildItem build\setup-only\*.exe).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\OMRCheckerTest","/LOG=build\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content build\setup.log -Tail 40; exit 1 }
          $files = @("OMRChecker.exe", "installed.ini", "ocr_build.json", "tesseract\tesseract.exe", "models\paddleocr")
          if ($env:KIND -eq "server") { $files += "cloudflared\cloudflared.exe" }
          foreach ($f in $files) {
            if (!(Test-Path "C:\OMRCheckerTest\$f")) { Write-Error "$f was not installed"; exit 1 }
          }
          $t = Start-Process -FilePath C:\OMRCheckerTest\OMRChecker.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { Write-Error "selftest of the installed app failed ($($t.ExitCode))"; exit 1 }
          $u = Start-Process -FilePath C:\OMRCheckerTest\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path C:\OMRCheckerTest\OMRChecker.exe) { Write-Error "uninstall left the program behind"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREFIX }}-windows-installer
          path: build/release/${{ env.PREFIX }}-setup-*.exe
          if-no-files-found: error

  # The License Issuer: the vendor's license admin as one exe. No private key
  # is built in; it asks for one at start (packaging/license_issuer.py).
  issuer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-win7.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip<25" wheel
          python -m pip install -r packaging/requirements-win7.txt

      - name: Build the License Issuer
        run: pyinstaller --noconfirm --clean packaging/license_issuer.spec

      - name: Smoke-test the License Issuer
        shell: pwsh
        run: |
          dist\OMRChecker-License-Issuer.exe --selftest --home "$env:RUNNER_TEMP\issuer"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath dist\OMRChecker-License-Issuer.exe -ArgumentList "--no-browser","--port","8797","--home","$env:RUNNER_TEMP\issuer" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8797/api/state; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "The License Issuer did not answer"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: OMRChecker-License-Issuer
          path: dist/OMRChecker-License-Issuer.exe
          if-no-files-found: error

  # Everything else onto the same release as the installers
  publish:
    needs: [build, issuer, installer]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.issuer.result == 'success' && (github.event_name == 'push' || github.event.inputs.installer_release != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.installer_release || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload the builds to the release
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in artifacts/OMRChecker-app/*.zip; do cp "$f" out/; done
          # The server build's names say so (the app's portable zip has the same name)
          [ -f artifacts/OMRChecker-server/OMRChecker-portable-win64.zip ] && cp artifacts/OMRChecker-server/OMRChecker-portable-win64.zip out/OMRChecker-server-portable-win64.zip
          [ -f artifacts/OMRChecker-server/OMRChecker-onefile.exe ] && cp artifacts/OMRChecker-server/OMRChecker-onefile.exe out/OMRChecker-server-onefile.exe
          cp artifacts/OMRChecker-License-Issuer/OMRChecker-License-Issuer.exe out/
          ls -l out
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $pre --title "OMR Checker $TAG" --notes "Windows builds of OMR Checker." || gh release view "$TAG" -R "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/* --clobber
